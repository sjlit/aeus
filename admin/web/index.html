<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aeus</title>
  <style>
    /* Vue 挂载前占位:bootstrap 期间的 loading。
       #app 有内容后会被覆盖,这里无需清理。 */
    html, body { margin: 0; }
    .boot {
      position: fixed; inset: 0;
      display: grid; place-items: center;
      /* 与 style.scss 的 --bg-base 及极光底色对齐,避免启动瞬间闪另一套色调 */
      background:
        radial-gradient(at 20% 10%, #e3f3ea 0%, transparent 50%),
        radial-gradient(at 80% 0%, #fde9e0 0%, transparent 55%),
        #f9fcfb;
      font-family: 'Inter Tight Variable', 'Inter Tight', system-ui, sans-serif;
      color: #5b7a78;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .boot::before {
      content: ''; width: 10px; height: 10px;
      background: #6cc5a8; border-radius: 2px;
      margin-right: 12px; box-shadow: 0 0 16px #6cc5a866;
      animation: boot-pulse 1.2s ease-in-out infinite;
    }
    /* 名字不能叫 pulse:keyframes 是全局的,会覆盖组件里同名动画。 */
    @keyframes boot-pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50%      { opacity: 1;   transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="app"><div class="boot">aeus</div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
