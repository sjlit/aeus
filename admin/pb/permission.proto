syntax = "proto3";

package pb;

import "google/api/annotations.proto";

option go_package = "github.com/sjlit/aeus/admin/pb;pb";

// PermissionService exposes the global permission catalog
// (sys_permissions).
service PermissionService {

  // Lists the global permission catalog (sys_permissions), optionally
  // filtered by type.
  // Wire format: GET /permission/catalog?type={0|1|2|3|4}.
  rpc ListCatalog(ListCatalogRequest) returns (ListCatalogResponse) {
    option (google.api.http) = {
      get: "/permission/catalog"
    };
  }

  // Lists full permission rows (id/type/data/description) for the
  // admin management UI.  ListCatalog returns only Permission.Data
  // strings (consumed by the runtime PermissionChecker); this endpoint
  // returns the same catalog with description metadata so the UI can
  // render labels alongside codes.
  // Wire format: GET /permission/list?type={api|button|data_scope}.
  // Empty type returns every row regardless of type.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = {
      get: "/permission/list"
    };
  }
}

// PermissionType discriminates the permission catalog entries and the
// role-permission queries.
enum PermissionType {
  PERMISSION_TYPE_UNSPECIFIED = 0;
  PERMISSION_TYPE_MENU        = 1;
  PERMISSION_TYPE_API         = 2;
  // Catalog types (see models.PermissionType).  Appended in 2026-08-07;
  // wire-safe: existing values 0-2 are unchanged.
  PERMISSION_TYPE_BUTTON     = 3;
  PERMISSION_TYPE_DATA_SCOPE = 4;
}

// ListCatalogRequest optionally filters the catalog by type;
// UNSPECIFIED (default) returns every entry.
message ListCatalogRequest {
  PermissionType type = 1;
}

// ListCatalogResponse carries the catalog entries as permission codes
// (Permission.Data), one string per entry.
message ListCatalogResponse {
  repeated string items = 1;
}

// ListPermissionItem is one full row from sys_permissions.  Field
// numbers follow the proto wire format — do not reuse 1-5 for other
// fields in this message; future revisions should append.
message ListPermissionItem {
  int64  id          = 1;
  string type        = 2;
  string data        = 3;
  string description = 4;
  // Group is the UI clustering label (e.g. "审计", "用户").
  // Auto-filled from MenuEntry().Name by derive.go on Setup; empty
  // for legacy rows that pre-date the column (auto-back-filled on
  // next Setup pass).  Operators can edit freely via /system/sys_perm.
  string group       = 5;
}

// ListPermissionsRequest optionally filters by Permission.Type (the
// models-layer string constant: "api", "button", "data_scope").  An
// empty type returns every row.
message ListPermissionsRequest {
  string type = 1;
}

// ListPermissionsResponse carries the full catalog rows for the
// management UI.
message ListPermissionsResponse {
  repeated ListPermissionItem items = 1;
}
